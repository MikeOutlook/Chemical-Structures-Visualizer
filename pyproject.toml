[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemical-visualizer"
version = "3.0.0"
description = "Generate 2D chemical structure images and Excel reports from SMILES strings"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MikeOutlook"}
]
keywords = ["chemistry", "rdkit", "smiles", "molecule", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.10"
dependencies = [
    "rdkit-pypi",
    "numpy<2",
    "pandas",
    "openpyxl",
    "Pillow",
    "customtkinter",
]

[project.optional-dependencies]
dev = [
    "build",
    "pyinstaller",
    "pytest",
    "pytest-cov",
    "twine",
]

[project.scripts]
chemviz = "chemical_visualizer.cli:main"

[project.urls]
Homepage = "https://github.com/MikeOutlook/Chemical-Structures-Visualizer"
Repository = "https://github.com/MikeOutlook/Chemical-Structures-Visualizer"
Issues = "https://github.com/MikeOutlook/Chemical-Structures-Visualizer/issues"

[tool.setuptools]
packages = ["chemical_visualizer", "gui"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
