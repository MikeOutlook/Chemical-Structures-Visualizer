[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemical-visualizer"
version = "1.2.0"
description = "Chemical Structure Visualizer - Generate chemical structure images from SMILES"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your@email.com"}
]
keywords = ["chemistry", "rdkit", "smiles", "molecule", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.8"
dependencies = [
    "rdkit-pypi",
    "pandas",
    "openpyxl",
    "Pillow",
    "customtkinter",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "build",
    "twine",
    "pytest",
]

[project.scripts]
chemviz = "chemical_visualizer.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/chemical-visualizer"
Repository = "https://github.com/yourusername/chemical-visualizer"
Issues = "https://github.com/yourusername/chemical-visualizer/issues"

[tool.setuptools]
packages = ["chemical_visualizer", "gui"]